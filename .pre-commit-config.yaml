ci:
  autofix_commit_msg: |
    chore: auto fixes from pre-commit.com hooks

    For more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: 'chore/pre-commit-autoupdate'
  autoupdate_commit_msg: 'chore: pre-commit automatic update'
  autoupdate_schedule: weekly

repos:

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 321478e58f4938179c6b86e4ddfa923d1547a49b # frozen: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: cef8b8350da46d8114c7e6b7272aebdccdf193ce # frozen: v1.30.0
    hooks:
      - id: zizmor
        args: ["--pedantic"]

  # NOTE: Ruff does not check for python code in some part of the documentation,
  # e.g. python code block, ..., see https://github.com/astral-sh/ruff/issues/8237
  - repo: https://github.com/adamchainz/blacken-docs
    rev: dda8db18cfc68df532abf33b185ecd12d5b7b326 # frozen: 1.20.0
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==25.1.0]
        args: ["--line-length=120"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: requirements-txt-fixer
      - id: trailing-whitespace
      - id: debug-statements

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # frozen: v2.4.3
    hooks:
      - id: codespell
        args: ["--ignore-words-list=synopsys"]
        # HACK: pre-commit is used during the code-style job in CI/CD. This job
  - repo: https://github.com/ansys/pre-commit-hooks

    # executes `pre-commit run --all-files --show-diff-on-failure`.
    # As per this issue https://github.com/pre-commit/pre-commit/issues/2936,
    # it looks like the `--all-files` only listens for the `exclude` option in a
    # pre-commit hook, ignoring `pyproject.toml` excludes.
    # args: [--ignore-words=./doc/styles/config/vocabularies/ANSYS/accept.txt]
    # TODO: pre-commit seems to ignore the configuration declared for codespell
    rev: 55c5b6a5439abd847613579c6924da750e8b78b2 # frozen: v0.8.0
    hooks:
      - id: add-license-headers
        args:
          - --custom_license=Apache-2.0
          - --start_year=2026

  - repo: https://github.com/google/yamlfmt
    rev: b5ca1890231d5e1e5181fef75a1be609d1e25029 # frozen: v0.21.0
    hooks:
      - id: yamlfmt
        args:
          - "-formatter"
          - "max_line_length=80,retain_line_breaks=true,retain_line_breaks_single=true,line_endings=lf"

  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce # frozen: v8.30.0
    hooks:
      - id: gitleaks
        args: [--config=.gitleaks.toml]
