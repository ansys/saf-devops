<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Compatibility Scan</title>
  <style>
    body { font-family: sans-serif; margin: 2em; }
    h1 { color: #333; }
    h2 { color: #555; }
    .success { color: green; font-weight: bold; }
    .failed  { color: red;   font-weight: bold; }
    pre { background: #f4f4f4; padding: 1em; border-radius: 4px; overflow-x: auto; }
    ul { margin: 0.5em 0; padding-left: 1.5em; }
    details { margin: 0.5em 0; }
    summary { cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Compatibility scan</h1>
  <p><strong>Test compatibility with</strong> ${PACKAGES}</p>

  <h2>Overview</h2>
  <ul>
    <li>Status: <span class="${STATUS_CLASS}">${STATUS_LABEL}</span></li>
    <li>Wheels scanned: ${TOTAL_WHEELS}</li>
    <li>Wheels passed: ${PASSED_WHEELS}</li>
    <li>Wheels failed: ${FAILED_WHEELS}</li>
  </ul>

  ${WHEELS_SECTION}

  <hr>
  <footer>Generated by Compatibility Scan (ansys/saf-devops/compatibility-scan)</footer>
</body>
</html>
