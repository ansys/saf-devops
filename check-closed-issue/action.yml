name: Verify Issue Closing Requirements

description: |
  This action verifies that all requirements for closing a GitHub issue are met.

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a # v7.1.5
      with:
        ignore-empty-workdir: true
        cache-dependency-glob: '${{ github.action_path}}/requirements.txt'

    - name: Create virtual environment and install dependencies
      if: github.event.issue.state == 'closed' && github.event.issue.state_reason
        == 'completed'
      shell: bash
      run: |
        uv venv .venv --python 3.12
        uv pip install -r ${GITHUB_ACTION_PATH}/requirements.txt
        uv run "${GITHUB_ACTION_PATH}/verify_issue_closing_requirements.py"
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
