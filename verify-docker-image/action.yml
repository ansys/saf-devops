name: Verify Docker Image

description: |
  Validates that a Docker image exists in GitHub Container Registry with the specified tag.

inputs:
  # Required
  package-name:
    description: "Name of the Docker image package"
    required: true
  package-tag:
    description: "Tag of the Docker image package"
    required: true
  # Optional
  organization:
    description: "GitHub organization (defaults to the repository owner)"
    required: false
  token:
    description: "Token with permissions to read package metadata (defaults to GITHUB_TOKEN)"
    required: false
outputs:
  tag-exists:
    description: "Does the tag exist?"
    value: ${{ steps.check-tag.outputs.tag_exists }}
  tags:
    description: "Tags of the Docker image package"
    value: ${{ steps.check-tag.outputs.tags }}

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a # v7.1.5
      with:
        ignore-empty-workdir: true
        cache-dependency-glob: '${{ github.action_path}}/requirements.txt'

    - name: Run verification script
      id: check-tag
      shell: bash
      run: |
        uv venv .venv --python 3.12 --clear
        uv pip install -r ${GITHUB_ACTION_PATH}/requirements.txt
        uv run "${GITHUB_ACTION_PATH}/script.py"
      env:
        GITHUB_TOKEN: ${{ inputs.token != '' && inputs.token || github.token }}
        ORGANIZATION: ${{ inputs.organization != '' && inputs.organization || github.repository_owner
          }}
        PACKAGE_NAME: ${{ inputs.package-name }}
        PACKAGE_TAG: ${{ inputs.package-tag }}
