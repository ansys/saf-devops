name: Get information from pyproject

description: |
  Get the information of a pyproject.toml file.

inputs:
  # Required
  pyproject-path:
    description: "Path of the pyproject.toml file"
    required: true
  # Optional with default values
  checkout:
    description: "Whether to checkout the repository. Set to false if the repository
      has already been checked out in a previous step and you want to skip it."
    required: false
    default: 'true'
outputs:
  package-name:
    description: "Name of the package"
    value: ${{ steps.get-info.outputs.package_name }}
  package-version:
    description: "Version of the package"
    value: ${{ steps.get-info.outputs.package_version }}
  major-version:
    description: "Major version of the package"
    value: ${{ steps.get-info.outputs.major_version }}
  minor-version:
    description: "Minor version of the package"
    value: ${{ steps.get-info.outputs.minor_version }}
  patch-version:
    description: "Patch version of the package"
    value: ${{ steps.get-info.outputs.patch_version }}

runs:
  using: "composite"
  steps:
    - name: Checkout code
      if: ${{ inputs.checkout == 'true' }}
      uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a # v7.1.5
      with:
        ignore-empty-workdir: true
        cache-dependency-glob: '${{ github.action_path}}/requirements.txt'

    - name: Create virtual environment and install dependencies
      id: get-info
      shell: bash
      run: |
        uv venv .venv --python 3.12
        uv pip install -r ${GITHUB_ACTION_PATH}/requirements.txt
        uv run "${GITHUB_ACTION_PATH}/script.py"
      env:
        FILE_PATH: ${{ inputs.pyproject-path }}
