version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(dependabot-actions)"
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "vale-cli/vale-action"
        versions:
          - "2.1.1"
    cooldown:
      include:
        - '*'
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/analyze-dependabot-alerts"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(dependabot-analyze-dependabot-alerts) "
    groups:
      python-dependencies:
        patterns:
          - "*"
    cooldown:
      include:
        - '*'
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/check-doc-for-broken-links"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(dependabot-check-doc-for-broken-links)"
    groups:
      python-dependencies:
        patterns:
          - "*"
    cooldown:
      include:
        - '*'
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/generate-sbom"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(dependabot-generate-sbom)"
    groups:
      python-dependencies:
        patterns:
          - "*"
    cooldown:
      include:
        - '*'
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/get-information-from-pyproject"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(dependabot-get-information-from-pyproject)"
    groups:
      python-dependencies:
        patterns:
          - "*"
    cooldown:
      include:
        - '*'
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/link-issue-to-pull-request"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(dependabot-link-issue-to-pull-request)"
    groups:
      python-dependencies:
        patterns:
          - "*"
    cooldown:
      include:
        - '*'
      default-days: 7
