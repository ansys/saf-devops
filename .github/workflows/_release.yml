name: _release

permissions: {}

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        type: string
        required: true
      poetry-version:
        description: "Poetry version to use."
        type: string
        required: false
        default: ''
      # Required
      release-name:
        description: "Name of the release"
        type: string
        required: true
      release-branch:
        description: "Name of the release branch"
        type: string
        required: true
      # Required with default
      poetry-parent-directory:
        description: "Parent directory for the poetry project."
        type: string
        default: '.'
      # Optional
      gh-pages-cname:
        description: "CNAME for GitHub Pages"
        type: string
        required: false
      poetry-install-args:
        description: >
          Additional arguments for poetry install when building docs. Use in nested
          workflows:
            doc-build
        type: string
        required: false
        default: '--only doc -vv'
      release-major-minor:
        description: "X.Y"
        type: string
        required: false
        default: ''
      env-vars:
        description: "Additional environment variables. Format: 'var-1: val-1\nvar-2:
          val-2' (YAML-like format)"
        type: string
        required: false
        default: ""
    secrets:
      PYANSYS_PRIVATE_PYPI_PAT:
        description: "Personal Access Token for private PyPI"
        required: false
      PYANSYS_PRIVATE_PYPI_URL:
        description: "URL for private PyPI"
        required: false

env:
  POETRY_HTTP_BASIC_SOLUTIONS_PRIVATE_PYPI_USERNAME: "PAT"
  POETRY_HTTP_BASIC_SOLUTIONS_PRIVATE_PYPI_PASSWORD: ${{ secrets.PYANSYS_PRIVATE_PYPI_PAT
    }}
  POETRY_HTTP_BASIC_PYANSYS_PRIVATE_PYPI_USERNAME: "PAT"
  POETRY_HTTP_BASIC_PYANSYS_PRIVATE_PYPI_PASSWORD: ${{ secrets.PYANSYS_PRIVATE_PYPI_PAT}}

jobs:
  build-doc:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-release-build-doc-${{ inputs.release-name
        }}
      cancel-in-progress: true
    uses: ansys/saf-devops/.github/workflows/_doc_build.yml@v1
    with:
      python-version: ${{ inputs.python-version }}
      poetry-version: ${{ inputs.poetry-version }}
      gh-pages-doc-artifact-name: "html-documentation-${{ inputs.release-name }}"
      gh-pages-cname: ${{ inputs.gh-pages-cname }}
      poetry-install-args: ${{ inputs.poetry-install-args }}
      ref: ${{ inputs.release-branch }}
      env-vars: ${{ inputs.env-vars }}
    secrets:
      PYANSYS_PRIVATE_PYPI_PAT: ${{ secrets.PYANSYS_PRIVATE_PYPI_PAT }}

  deploy-doc:
    permissions:
      contents: write # Required to push to gh-pages branch
    needs: build-doc
    uses: ansys/saf-devops/.github/workflows/_doc_deploy.yml@v1
    with:
      gh-pages-doc-artifact-name: "html-documentation-${{ inputs.release-name }}"
      gh-pages-cname: ${{ inputs.gh-pages-cname }}
      ref: ${{ inputs.release-name }}
      version: ${{ inputs.release-major-minor }}

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      attestations: write # Write attestation for uploaded distribution artifacts
      contents: read # Read the source code of the project
      id-token: write # Write access to a temporary token for signing attestations
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-branch }}
          persist-credentials: false

      - uses: ansys/actions/build-library@7410037bfb276c79ae91eb3617b9f5d2876f0c94 # v11.0.8
        with:
          library-name: wheel-${{ inputs.release-name }}
          python-version: ${{ inputs.python-version }}
          attest-provenance: true
          validate-build: true
          use-uv: false
          checkout: false
        env:
          PIP_EXTRA_INDEX_URL: ${{ secrets.PYANSYS_PRIVATE_PYPI_URL != '' && format('https://PAT:{0}@{1}',
            secrets.PYANSYS_PRIVATE_PYPI_PAT, secrets.PYANSYS_PRIVATE_PYPI_URL) ||
            ''}}

  save-to-release-assets:
    permissions:
      contents: write # To upload assets to the release
    name: Save additional files to the release assets
    needs:
      - build
    runs-on: ubuntu-latest
    env:
      RELEASE_NAME: ${{ inputs.release-name }}
      GITHUB_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
    steps:
      - name: Checkout repository # needed to use gh
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Download sbom
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: 'sbom*'
          path: sbom
        continue-on-error: true

      - name: Upload sbom to release assets
        if: ${{ hashFiles('sbom') }}
        run: |
          zip -r sbom.zip sbom
          gh release upload ${RELEASE_NAME} sbom.zip

      - name: Download wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "wheel-${{ inputs.release-name }}-artifacts"
          path: wheel
        continue-on-error: true

      - name: Upload wheel to release assets
        if: ${{ hashFiles('wheel') }}
        run: |
          gh release upload ${RELEASE_NAME} wheel/*.whl
        continue-on-error: true
