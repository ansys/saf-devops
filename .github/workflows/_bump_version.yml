name: _bump_version

permissions: {}
on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use."
        type: string
        required: true
      # Required
      poetry-version:
        description: "Poetry version to use."
        required: true
        type: string
      new-version:
        description: "New version; version to set in the manifest file."
        type: string
        required: true
      base-ref:
        description: "Reference to checkout. Default: github.ref"
        type: string
        required: true
      # Required with default
      poetry-parent-directory:
        description: "Whitespace-separated parent directories for the Poetry projects."
        type: string
        default: '.'
      suffix-bump-branch:
        description: "Suffix for the bump branch name. Default: ''"
        type: string
        default: ''
    secrets:
      BUMP_VERSION_TOKEN:
        description: "Token for bumping version"
        required: true
      PYANSYS_CI_BOT_TOKEN:
        description: "Token for the bot account used to create PR."
        required: false
      PYANSYS_CI_BOT_EMAIL:
        description: "Email for the bot account used to create PR. Default: actions@github.com"
        required: false
      PYANSYS_CI_BOT_USERNAME:
        description: "Username for the bot account used to create PR. Default: actions"
        required: false

jobs:
  bump-version:
    permissions:
      contents: write # To commit changes
      pull-requests: write # To create a PR to bump the version
    name: Bump Version
    environment: saf-release
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: "bump/v${{ inputs.new-version }}${{ inputs.suffix-bump-branch }}"
      POETRY_VERSION: ${{ inputs.poetry-version }}
      NEW_VERSION: ${{ inputs.new-version }}
      BASE_REF: ${{ inputs.base-ref }}
      SUFFIX_BUMP_BRANCH: ${{ inputs.suffix-bump-branch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.base-ref }}
          token: ${{ github.token }}
          persist-credentials: true

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Edit versions in pyproject.toml files
        shell: bash
        run: |
          ${PYTHON_PATH} -m pip install poetry==${POETRY_VERSION}
          read -r -a poetry_parent_directories <<< "${POETRY_PARENT_DIRECTORIES}"
          for poetry_parent_directory in "${poetry_parent_directories[@]}"; do
            (
              cd -- "${poetry_parent_directory}"
              ${PYTHON_PATH} -m poetry version "${NEW_VERSION}"
              cd -- "${GITHUB_WORKSPACE}"
            )
          done
        env:
          PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
          POETRY_PARENT_DIRECTORIES: ${{ inputs.poetry-parent-directory }}

      - name: Create bump branch
        run: |
          git switch --create ${BRANCH_NAME}
          git push origin HEAD:${BRANCH_NAME}

      - name: Publish bump branch and create PR
        id: pr-info
        run: |
          git config --global user.email "${EMAIL}"
          git config --global user.name "${USERNAME}"
          git add .
          git commit -m "Auto commit changes"
          git push origin HEAD:${BRANCH_NAME}

          pr_url=$(gh pr create \
            --title "chore(bump): v${NEW_VERSION}${SUFFIX_BUMP_BRANCH}" \
            --body "Bump to v${NEW_VERSION}" \
            --head "${BRANCH_NAME}" \
            --base "${BASE_REF}")
          echo "[pr-info] ℹ️ PR created: $pr_url"
          echo "pr-url=$pr_url" >> $GITHUB_OUTPUT

          # Extract PR number from URL
          pr_number=$(echo "$pr_url" | sed 's|.*/pull/||')
          echo "pr-number=$pr_number" >> $GITHUB_OUTPUT
        env:
          EMAIL: ${{ secrets.PYANSYS_CI_BOT_EMAIL != '' && secrets.PYANSYS_CI_BOT_EMAIL
            || 'actions@github.com' }}
          USERNAME: ${{ secrets.PYANSYS_CI_BOT_USERNAME != '' && secrets.PYANSYS_CI_BOT_USERNAME
            || 'actions' }}
          GH_TOKEN: ${{ secrets.BUMP_VERSION_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.BUMP_VERSION_TOKEN }}

      - name: Approve and Merge
        run: |
          gh pr edit "${PR_URL}" --add-label "auto-approve"
          gh pr review --approve "${PR_URL}"
          gh pr merge --auto --squash --delete-branch "${PR_URL}"
        env:
          GH_TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN != '' && secrets.PYANSYS_CI_BOT_TOKEN
            || github.token }}
          PR_URL: ${{ steps.pr-info.outputs.pr-url }}
        continue-on-error: true
