name: Generate Release Notes

description: |
  Generate release notes for a release.

inputs:
  # Required
  tag-name:
    description: "Tag name for which to generate release notes."
    type: string
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
      with:
        python-version: '3.12'

    - name: Install python dependencies
      shell: bash
      run: |
        ${PYTHON_PATH} -m pip install pip --upgrade
        ${PYTHON_PATH} -m pip install requests==2.32.5 packaging==24.1
      env:
        PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}

    - name: Generate release notes
      shell: bash
      run: ${PYTHON_CMD} ${SCRIPT_PATH}
      env:
        REPOSITORY: ${{ github.repository }}
        ISSUES_REPOSITORY: ${{ github.repository }}
        TAG_NAME: ${{ inputs.tag-name }}
        GITHUB_TOKEN: ${{ github.token }}
        SCRIPT_PATH: "${{ github.action_path }}/get_release_notes.py"
        PYTHON_CMD: ${{ steps.setup-python.outputs.python-path }}

    - name: Upload release notes to artifacts
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: release-notes
        path: release_notes.md
